[package]
name = "alternate"
version = "0.1.0"
edition = "2024"
description = "A native Mac writing app for trying different versions of a word, sentence or paragraph in place"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "bca47138e9c31a7870a79272ee2523b592b1248d" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "bca47138e9c31a7870a79272ee2523b592b1248d" }
rune-fx = { git = "https://github.com/anomalyco/rune", rev = "bca47138e9c31a7870a79272ee2523b592b1248d" }
rune-mac = { git = "https://github.com/anomalyco/rune", rev = "bca47138e9c31a7870a79272ee2523b592b1248d" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev.package."*"]
opt-level = 2

# Adds Cx::text_rects and Picked::text_index. See branch alternate-text-rects in this clone.
[patch."https://github.com/anomalyco/rune"]
rune = { path = "../rune-alternate/crates/rune" }
rune-kit = { path = "../rune-alternate/crates/rune-kit" }
rune-fx = { path = "../rune-alternate/crates/rune-fx" }
rune-mac = { path = "../rune-alternate/crates/rune-mac" }
